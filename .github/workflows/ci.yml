name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Resolve the remote package and build the app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      # This step is the point of the job. It proves the version-pinned remote
      # package reference in project.pbxproj genuinely resolves from GitHub,
      # rather than only compiling against something already on disk.
      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Demo.xcodeproj \
            -scheme Demo

      - name: Show the resolved version
        run: cat Demo.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved

      # `generic/platform=iOS Simulator` compiles without requiring any
      # simulator *runtime* to be installed. Pinning a device name
      # (`name=iPhone 16,OS=latest`) ties the job to whichever runtimes that
      # day's runner image happens to ship, and fails with "Unable to find a
      # device matching the provided destination specifier" on commits that
      # changed nothing.
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Demo.xcodeproj \
            -scheme Demo \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
